name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships an Android SDK, but cmdline-tools is not on PATH.
      # (android-actions/setup-android is unmaintained and installs the
      # obsolete 'tools' package, which no longer exists upstream.)
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
            PATH="$d:$PATH"
          done
          export PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0"
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Test and assemble
        run: ./gradlew :biat-ui:testDebugUnitTest :biat-ui:assembleRelease :sample:assembleDebug :biat-ui:apiCheck

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
            PATH="$d:$PATH"
          done
          export PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0"
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
